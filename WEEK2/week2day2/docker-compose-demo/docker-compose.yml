services:
  postgres:
    image: postgres:16-alpine
    container_name: db_service
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_service
    environment:
      PORT: 5000
      DATABASE_URL: postgres://devuser:devpassword@postgres:5432/appdb
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client_service
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
